name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  packed:
    name: Packed package
    if: github.event.release.prerelease == false && github.event.release.draft == false
    uses: ./.github/workflows/packed-package.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      release-tag: ${{ github.event.release.tag_name }}

  # npm's trusted publisher is bound to this file name and the npm environment,
  # so the OIDC permission and environment stay on this job, not in the shared workflow.
  publish:
    needs: packed
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TARBALL: ${{ needs.packed.outputs.tarball }}
      EXPECTED_SHA256: ${{ needs.packed.outputs.sha256 }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.packed.outputs.artifact }}
          path: ${{ runner.temp }}/packed

      - name: Verify tarball checksum
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/packed/$TARBALL" | sha256sum --check --strict

      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP/packed/$TARBALL" --provenance
