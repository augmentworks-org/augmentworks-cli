name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out released tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Release tag must equal v'+p.version)"

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run check && npm run audit:ci

      - name: Validate committed examples
        env:
          CHATBOT_BASE_URL: http://127.0.0.1:8000
          CHATBOT_API_KEY: ci-placeholder-only
        run: |
          node dist/index.js doctor --offline -c examples/basic-chat/augmentworks.yaml
          node dist/index.js doctor --offline -c examples/refund-agent/augmentworks.yaml

      - name: Smoke-test packed npx package
        run: npm run smoke:pack

      - name: Publish with provenance
        run: npm publish
