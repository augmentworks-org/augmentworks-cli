name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
          - 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit dependency tree
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run audit:ci

      - name: Validate committed examples
        env:
          CHATBOT_BASE_URL: http://127.0.0.1:8000
          CHATBOT_API_KEY: ci-placeholder-only
        run: |
          node dist/index.js doctor --offline -c examples/basic-chat/augmentworks.yaml
          node dist/index.js doctor --offline -c examples/refund-agent/augmentworks.yaml

      - name: Run source packaged demo
        run: node dist/index.js demo --json --output-dir .augmentworks/ci-source-demo

      - name: Smoke-test packed npx package
        if: matrix.node == 22
        run: npm run smoke:pack
