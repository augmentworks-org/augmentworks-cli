version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tsup 9 requires Node 22.18+, above the >=22.12 floor the dev toolchain must still install on.
      - dependency-name: tsup
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

