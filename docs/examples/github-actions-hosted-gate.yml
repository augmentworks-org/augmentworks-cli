# Customer GitHub Actions example for this 0.3.8 package hosted CI with a
# read-only semantic release gate.
#
# Quoted `--max-credits`, `run wait`, and `gate` are in this 0.3.8 package.
# Do not overwrite npm 0.3.5, 0.3.4, or 0.3.3.
# No browser. npm `--yes` is not a spending ceiling. Billing rejection is
# exit 13; a new required semantic regression is exit 10 even when
# aggregate pass rates match; incomplete grading or an incomplete gate is
# 11; evaluator error is 12. Pending or partial evaluation exits 11 and does
# not call gate. A completed run whose billing status omits outcome
# (execution completed, evaluation complete, outcome null) also exits 11
# from run wait; that status query still calls gate and is not a pass.
# Do not treat a null billing outcome as exit 0.
# Recover an interrupted create before starting another admission.
# Do not auto-promote a baseline. Prefer repository secret AUGMENTWORKS_API_KEY
# (AUGMENTWORKS_TOKEN remains a compatible injection). The complete hosted
# GitHub Actions journey, scoped machine key, isolated target startup, fork-PR
# policy, and CI provenance via gate live in github-actions-hosted.yml.

name: AugmentWorks hosted assessment with release gate (source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-gate:
    name: Quoted hosted assessment then read-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Build source CLI
        run: |
          npm ci
          npm run build

      - name: Estimate, run with an explicit ceiling, wait, then gate
        env:
          AUGMENTWORKS_API_URL: ${{ secrets.AUGMENTWORKS_API_URL }}
          AUGMENTWORKS_TOKEN: ${{ secrets.AUGMENTWORKS_TOKEN }}
          AUGMENTWORKS_WORKSPACE_ID: ${{ secrets.AUGMENTWORKS_WORKSPACE_ID }}
          AUGMENTWORKS_BASELINE_ID: ${{ secrets.AUGMENTWORKS_BASELINE_ID }}
          CHATBOT_BASE_URL: http://127.0.0.1:8000
          CHATBOT_API_KEY: ci-synthetic-placeholder
        run: |
          if [ -z "$AUGMENTWORKS_WORKSPACE_ID" ]; then
            echo "Set AUGMENTWORKS_WORKSPACE_ID to the expected workspace UUID." >&2
            exit 2
          fi
          if [ -z "$AUGMENTWORKS_BASELINE_ID" ]; then
            echo "Set AUGMENTWORKS_BASELINE_ID to an explicit pin. The CLI will not invent or promote one." >&2
            exit 2
          fi
          node dist/index.js test \
            --assessment ./augmentworks.assessment.yaml \
            --estimate \
            --json
          set +e
          json=$(node dist/index.js test \
            --assessment ./augmentworks.assessment.yaml \
            --max-credits 30 \
            --yes \
            --json)
          code=$?
          set -e
          printf '%s\n' "$json"
          run_id=$(printf '%s\n' "$json" | node -e "
            let s = '';
            process.stdin.on('data', (d) => { s += d; });
            process.stdin.on('end', () => {
              const parsed = JSON.parse(s);
              process.stdout.write(String(parsed.run_id ?? parsed.runId ?? ''));
            });
          ")
          if [ -z "$run_id" ]; then
            echo "No run id. Inspect recover before starting another hosted test." >&2
            set +e
            node dist/index.js recover --json
            set -e
            exit "$code"
          fi
          mkdir -p .augmentworks/ci
          set +e
          node dist/index.js run wait "$run_id" --json --timeout-ms 60000 > .augmentworks/ci/wait.json
          wait_code=$?
          set -e
          cat .augmentworks/ci/wait.json
          # Same contracted wait 11 split as github-actions-hosted.yml:
          # unfinished grading skips gate; completed grading with a null
          # billing outcome is a terminal status query and still calls gate.
          grading_ready=0
          if [ "$wait_code" -eq 11 ]; then
            grading_ready="$(node -e "
              // aw-hosted-ci-grading-ready
              const fs = require('node:fs');
              let ready = false;
              try {
                const parsed = JSON.parse(fs.readFileSync('.augmentworks/ci/wait.json', 'utf8'));
                const outcome = Object.prototype.hasOwnProperty.call(parsed, 'outcome') ? parsed.outcome : null;
                ready = parsed.ok === true
                  && parsed.observation === 'succeeded'
                  && parsed.work === 'terminal'
                  && parsed.assessment === 'incomplete'
                  && parsed.executionStatus === 'completed'
                  && parsed.evaluationStatus === 'complete'
                  && (outcome === null || outcome === '');
              } catch {
                ready = false;
              }
              process.stdout.write(ready ? '1' : '0');
            ")"
          fi
          if [ "$wait_code" -ne 0 ] && [ "$wait_code" -ne 10 ] && [ "$grading_ready" != "1" ]; then
            echo "Wait did not finish for original run $run_id. Re-query that ID. Do not start another billed assessment." >&2
            exit "$wait_code"
          fi
          if [ "$grading_ready" = "1" ]; then
            echo "Billing status omitted outcome after completed grading for original run $run_id. Continuing to the release gate. This is not unfinished evaluation and is not a pass." >&2
          fi
          node dist/index.js gate \
            --run "$run_id" \
            --baseline "$AUGMENTWORKS_BASELINE_ID" \
            --json
